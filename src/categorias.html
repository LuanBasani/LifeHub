<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Hub - Categorias</title>
    <link rel="icon" href="../assets/Logos-imagens/LifeHub-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="categorias.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <a href="index.html">
                <img src="../assets/Logos-imagens/LifeHub-icon.png" alt="Logo life hub">
            </a>
        </div>
        
        <nav class="botoes">
            <button onclick="window.location.href='index.html'">Início</button>
            <button onclick="window.location.href='categorias.html'">Categorias</button>
            <button onclick="window.location.href='sobre.html'">Sobre</button>
        </nav>
    </header>

    <main>
        <h1>Escolha uma Categoria</h1>
        <p>Selecione o tipo de resíduo para saber como descartá-lo corretamente.</p>

        <section class="categorias">
            <div class="cartao" onclick="window.location.href='categorias/plastico.html'">
                <img src="../assets/Residuos/Plastico/plastico1.png" alt="Plástico">
                <h2>Plástico</h2>
            </div>

            <div class="cartao" onclick="window.location.href='categorias/papel.html'">
                <img src="../assets/Residuos/Papel/papel-reciclavel (1).png" alt="Papel">
                <h2>Papel</h2>
            </div>

            <div class="cartao" onclick="window.location.href='categorias/vidro.html'">
                <img src="../assets/Residuos/Vidro/garrafa (1).png" alt="Vidro">
                <h2>Vidro</h2>
            </div>

            <div class="cartao" onclick="window.location.href='categorias/metal.html'">
                <img src="../assets/Residuos/Metal/metal3.png" alt="Metal">
                <h2>Metal</h2>
            </div>

            <div class="cartao" onclick="window.location.href='categorias/organico.html'">
                <img src="../assets/Residuos/Organico/organico1.png" alt="Orgânico">
                <h2>Orgânico</h2>
            </div>

            <div class="cartao" onclick="window.location.href='categorias/eletronico.html'">
                <img src="../assets/Residuos/Eletronico/ele2.png" alt="Eletrônico">
                <h2>Eletrônicos</h2>
            </div>
        </section>
    </main>

    <footer>

        <div class="paginas">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="categorias.html">Categorias</a></li>
            </ul>
        </div>

        <div class="conscientizacao">
            <img src="../assets/Logos-imagens/LifeHub-icon.png" alt="Logo life hub" height="100">
            <h2><blockquote>🌿 "Preservar hoje é garantir o amanhã."</blockquote></h2>
        </div>

    </footer>
</body>
</html>
